<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* ===== ЦВЕТА САЙТА: три цвета из палитры Material 3 + нейтральные ===== */
  :root {
    --primary:  #6750A4;   /* 1. мягкий фиолетовый: кнопки, точки, акценты */
    --lavender: #EADDFF;   /* 2. светло-сиреневый: плашки, выбранное */
    --rose:     #FFD8E4;   /* 3. нежно-розовый: подсказки, метка на карте */
    /* нейтральные (в счёт цветов не входят) */
    --surface: #FEF7FF; --card: #F3EDF7; --paper: #FFFFFF;
    --ink: #1D1B20; --ink2: #49454F; --line: #CAC4D0;
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Nunito', 'Noto Sans KR', system-ui, sans-serif;
    background: var(--surface); color: var(--ink);
    min-height: 100vh; line-height: 1.55; overflow-x: hidden;
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ---------- кнопки ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 24px; border: none; border-radius: 999px;
    font: 500 .95rem/1 inherit; font-family: inherit; cursor: pointer;
    background: var(--primary); color: #fff;
    transition: box-shadow .2s, filter .2s, background .2s, transform .1s;
  }
  .btn:hover { box-shadow: 0 1px 4px rgba(29,27,32,.28); filter: brightness(1.06); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: wait; box-shadow: none; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .btn.tonal { background: var(--lavender); color: var(--ink); }
  .btn.tonal:hover { filter: brightness(.97); }
  .btn.outline { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.outline:hover { background: rgba(103,80,164,.08); filter: none; }
  .btn.text { background: transparent; color: var(--primary); padding: 0 16px; }
  .btn.text:hover { background: rgba(103,80,164,.08); box-shadow: none; filter: none; }
  .btn.text.active, .btn.text.on { background: var(--lavender); color: var(--ink); }
  .btn.lg { height: 56px; padding: 0 32px; font-size: 1rem; }
  .btn.sm { height: 34px; padding: 0 16px; font-size: .875rem; }

  /* ---------- верхняя панель ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 24px; background: rgba(254,247,255,.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(202,196,208,.5);
  }
  .langs { display: inline-flex; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; margin-left: 4px; }
  .langs button { border: none; background: transparent; font: 500 .85rem/1 inherit; font-family: inherit; color: var(--primary); height: 34px; padding: 0 14px; cursor: pointer; }
  .langs button:hover { background: rgba(103,80,164,.08); }
  .langs button.on { background: var(--lavender); color: var(--ink); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 1.1rem; letter-spacing: .01em; }
  .logo svg { width: 28px; height: 28px; }
  nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

  main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 24px 24px 80px; }
  .view { display: none; }
  .view.active { display: block; }
  .narrow { max-width: 900px; margin: 0 auto; }

  /* ---------- Земля из точек на фоне главного экрана ---------- */
  #globeBg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: none; }
  body.is-home #globeBg { display: block; }
  @media (max-width: 899px) { #globeBg { opacity: .55; } }

  /* ---------- главная ---------- */
  .hero { max-width: 560px; padding: clamp(36px, 9vh, 100px) 0 0; }
  .hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.12; font-weight: 500; letter-spacing: -.02em; }
  .hero h1 span { color: var(--primary); }
  .hero p { margin-top: 20px; font-size: 1.15rem; color: var(--ink2); max-width: 470px; }
  .modes { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 36px; }
  .home-contacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: clamp(40px, 9vh, 90px); }
  .home-contacts a {
    display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 999px;
    font-size: .875rem; color: var(--ink2); text-decoration: none; background: rgba(254,247,255,.85);
    box-shadow: inset 0 0 0 1px var(--line); transition: background .2s, color .2s;
  }
  .home-contacts a:hover { background: var(--lavender); color: var(--ink); }

  /* ---------- общие заголовки ---------- */
  h2 { font-size: 2rem; font-weight: 500; letter-spacing: -.01em; }
  .lead { color: var(--ink2); margin: 6px 0 24px; }

  /* ---------- как это работает ---------- */
  .steps { list-style: none; padding: 0; counter-reset: s; display: grid; gap: 12px; }
  .steps li {
    counter-increment: s; display: flex; gap: 16px; align-items: flex-start;
    padding: 16px 20px; border-radius: 24px; background: var(--card);
  }
  .steps li::before {
    content: counter(s); flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
    background: var(--lavender); display: grid; place-items: center; font-weight: 500;
  }

  /* ---------- контакты ---------- */
  .card { border-radius: 28px; padding: 8px 28px; background: var(--card); }
  .contact-row { display: flex; gap: 12px; flex-wrap: wrap; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .contact-row:last-child { border: none; }
  .contact-row b { min-width: 130px; font-weight: 500; color: var(--primary); }
  .contact-row a { color: var(--ink); }
  .contact-row a:hover { color: var(--primary); }

  /* ---------- рисование ---------- */
  .stage {
    position: relative; width: 100%; max-width: 680px; margin: 0 auto; aspect-ratio: 4 / 3;
    border-radius: 28px; overflow: hidden; background: var(--paper); border: 1px solid var(--line);
  }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage video { object-fit: cover; transform: scaleX(-1); opacity: .5; }
  .stage canvas { touch-action: none; }
  #mouseCanvas { cursor: crosshair; }
  .cursor {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    border: 3px solid var(--primary); pointer-events: none; display: none;
  }
  .cursor.draw { background: var(--primary); }
  .toolbar { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 16px 0; flex-wrap: wrap; }
  .toolbar .label { font-size: .875rem; color: var(--ink2); margin-right: 4px; }
  .hint { text-align: center; font-size: .95rem; color: var(--ink2); min-height: 1.6em; }
  .hint.error { color: var(--primary); font-weight: 500; }

  /* ---------- результаты ---------- */
  .results-hint { margin: 28px 0 12px; font-weight: 500; }
  .results { display: grid; gap: 12px; }
  .result {
    display: flex; gap: 16px; border-radius: 24px; overflow: hidden; background: var(--card); cursor: pointer;
    transition: box-shadow .2s, transform .2s;
  }
  .result:hover { box-shadow: 0 3px 14px rgba(103,80,164,.2); transform: translateY(-2px); }
  .result img, .result .noimg { width: 168px; min-height: 140px; object-fit: cover; flex-shrink: 0; background: var(--lavender); }
  .result .body { padding: 14px 18px 14px 0; display: flex; flex-direction: column; gap: 2px; }
  .result h3 { font-size: 1.15rem; font-weight: 500; }
  .result .meta { font-size: .875rem; color: var(--ink2); }
  .result p { font-size: .95rem; margin-top: 4px; }
  .result .go { margin-top: auto; padding-top: 8px; color: var(--primary); font-weight: 500; font-size: .9rem; }
  .bar { height: 6px; background: var(--lavender); border-radius: 3px; margin: 8px 0 4px; overflow: hidden; max-width: 260px; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
  @media (max-width: 560px) {
    .result { flex-direction: column; }
    .result img, .result .noimg { width: 100%; height: 170px; }
    .result .body { padding: 0 18px 16px; }
  }

  /* ---------- экран здания ---------- */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-top: 16px; align-items: start; }
  .viewer-card {
    position: sticky; top: 84px; aspect-ratio: 1 / 1; border-radius: 28px; overflow: hidden;
    background: var(--card);
  }
  #modelCanvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #modelCanvas:active { cursor: grabbing; }
  .v-hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: .8rem; color: var(--ink2); pointer-events: none; }
  .v-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: var(--card); }
  .v-overlay[hidden] { display: none; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); animation: bounce 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.55); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  .info-card { display: flex; flex-direction: column; gap: 16px; }
  .chip { align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: var(--lavender); font-size: .85rem; font-weight: 500; min-height: 28px; }
  .chip:empty { display: none; }
  .info-card h2 { font-size: 2.1rem; line-height: 1.15; }
  .info-card .sub { color: var(--ink2); margin-top: -8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { padding: 14px 16px; border-radius: 20px; background: var(--lavender); }
  .stat small { display: block; font-size: .8rem; color: var(--ink2); }
  .stat b { font-size: 1.2rem; font-weight: 500; }
  .summary { font-size: 1.02rem; }
  .fact { padding: 16px 18px; border-radius: 20px; background: var(--rose); }
  .fact[hidden] { display: none; }
  .fact b { display: block; margin-bottom: 2px; }
  .media { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photo, .mini { position: relative; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; background: var(--card); margin: 0; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo figcaption, .mini .cap { position: absolute; left: 8px; bottom: 8px; padding: 2px 10px; border-radius: 999px; background: rgba(254,247,255,.88); font-size: .72rem; color: var(--ink2); }
  #miniGlobe { width: 100%; height: 100%; display: block; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { text-decoration: none; }
  @media (max-width: 860px) {
    .detail { grid-template-columns: 1fr; }
    .viewer-card { position: relative; top: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

    <ol class="steps" id="infoSteps"></ol>
  </section>

  <!-- РИСОВАНИЕ МЫШЬЮ -->
  <section class="view narrow" id="view-mouse">
    <div class="toolbar">
      <span class="label" data-i18n="tryIt"></span>
      <button class="btn tonal sm" data-ex="triangle" data-i18n="exTriangle"></button>
      <button class="btn tonal sm" data-ex="twin" data-i18n="exTwin"></button>
      <button class="btn tonal sm" data-ex="spire" data-i18n="exSpire"></button>
    </div>
    <div class="stage"><canvas id="mouseCanvas" width="640" height="480"></canvas></div>
    <div class="toolbar">
      <button class="btn" id="mouseGuess" data-i18n="guess"></button>
      <button class="btn outline" id="mouseUndo" data-i18n="undo"></button>
      <button class="btn outline" id="mouseClear" data-i18n="clear"></button>
      <button class="btn outline" id="mouseSave" data-i18n="save"></button>
    </div>
    <p class="hint" id="mouseHint"></p>
    <div id="mouseResults"></div>
  </section>

  <!-- РИСОВАНИЕ КАМЕРОЙ -->
  <section class="view narrow" id="view-cam">
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="camCanvas" width="640" height="480"></canvas>
      <div class="cursor" id="cursor"></div>
    </div>
    <div class="toolbar">
      <button class="btn tonal" id="camStart" data-i18n="camStart"></button>
      <button class="btn" id="camGuess" data-i18n="guess"></button>
      <button class="btn outline" id="camClear" data-i18n="clear"></button>
    </div>
    <p class="hint" id="camHint"></p>
    <div id="camResults"></div>
  </section>

  <!-- ЭКРАН ЗДАНИЯ: 3D из точек и описание -->
  <section class="view" id="view-detail">
    <button class="btn tonal sm" id="dBack"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg><span data-i18n="back"></span></button>
    <div class="detail">
      <div class="viewer-card">
        <canvas id="modelCanvas"></canvas>
        <div class="v-overlay" id="vOverlay">
          <div class="dots" id="vDots"><i></i><i></i><i></i></div>
          <p id="vMsg"></p>
          <button class="btn tonal sm" id="dRetry" hidden data-i18n="retry"></button>
        </div>
        <p class="v-hint" data-i18n="viewerHint"></p>
      </div>
      <div class="info-card">
        <span class="chip" id="dType"></span>
        <h2 id="dTitle"></h2>
        <p class="sub" id="dSub"></p>
        <div class="stats" id="dStats"></div>
        <p class="summary" id="dSummary"></p>
        <div class="fact" id="dFact" hidden></div>
        <div class="media">
          <figure class="photo" id="dPhotoBox" hidden><img id="dPhoto" alt=""><figcaption data-i18n="photoCredit"></figcaption></figure>
          <div class="mini"><canvas id="miniGlobe"></canvas><span class="cap" id="dWhere"></span></div>
        </div>
        <div class="links" id="dLinks"></div>
      </div>
    </div>
  </section>
</main>

      const L = cum[cum.length - 1] || 1, r = Math.abs(num(p.r)) || 1, r2 = p.r2 == null ? r : Math.abs(num(p.r2));
      items.push({ area: L * TAU * (r + r2) / 2, fn: () => {
        const s = rnd() * L; let i = 1;
        while (i < cum.length - 1 && cum[i] < s) i++;
        const t = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1), A = line[i - 1], B = line[i];
        let T = [B[0] - A[0], B[1] - A[1], B[2] - A[2]]; const tl = Math.hypot(...T) || 1; T = T.map(v => v / tl);
        const ref = Math.abs(T[1]) > .9 ? [1, 0, 0] : [0, 1, 0];
        const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

    }
  }
  const sumArea = items.reduce((s, i) => s + i.area, 0);
  if (!items.length || !(sumArea > 0)) return null;
  const raw = [];
  for (const it of items) {
    const n = Math.max(30, Math.round(total * it.area / sumArea));
    for (let k = 0; k < n; k++) { const q = it.fn(); if (q.every(Number.isFinite)) raw.push(q); }

  if (raw.length < 50) return null;
  let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  raw.forEach(q => q.forEach((v, k) => { if (v < mn[k]) mn[k] = v; if (v > mx[k]) mx[k] = v; }));
  const mx0 = (mn[0] + mx[0]) / 2, mz0 = (mn[2] + mx[2]) / 2, hh = (mx[1] - mn[1]) / 2 || 1;
  let rMax = 0; raw.forEach(q => { rMax = Math.max(rMax, Math.hypot(q[0] - mx0, q[2] - mz0)); });

  raw.forEach((q, i) => {
    p[i * 3] = (q[0] - mx0) * sc; p[i * 3 + 1] = (q[1] - mn[1] - hh) * sc; p[i * 3 + 2] = (q[2] - mz0) * sc;
    h01[i] = (q[1] - mn[1]) / (2 * hh);
  });
  return { p, h01, n: raw.length, gy: -hh * sc, rr: Math.max(.35, rMax * sc * 1.12) };
}

/* ============ ПРОСМОТР 3D: вращение мышкой, масштаб колёсиком ============ */
class Viewer {
  constructor(canvas) {
    this.c = canvas; this.g = canvas.getContext('2d'); this.cloud = null; this.raf = 0; this.last = 0;
    this.yaw = .7; this.pitch = .25; this.zoom = 1; this.auto = true; this.drag = false; this.idle = 0; this.t0 = 0;
    let prev = null;
    canvas.addEventListener('pointerdown', e => { prev = [e.clientX, e.clientY]; this.drag = true; this.auto = false; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => {
      if (!prev) return;
      this.yaw += (e.clientX - prev[0]) * .01;
      this.pitch = Math.max(-.25, Math.min(1.25, this.pitch + (e.clientY - prev[1]) * .008));
      prev = [e.clientX, e.clientY];
    });
    ['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { prev = null; this.drag = false; this.idle = 0; }));
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.zoom = Math.max(.6, Math.min(2.6, this.zoom * (1 - e.deltaY * .0012))); }, { passive: false });
    canvas.addEventListener('dblclick', () => { this.zoom = 1; this.pitch = .25; this.auto = true; });
  }
  setCloud(cloud) { this.cloud = cloud; this.t0 = performance.now(); this.auto = true; this.zoom = 1; }
  start() {
    if (this.raf) return;
    this.last = performance.now();
    const loop = t => { this.draw(t); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
  draw(t) {
    const dt = Math.min(64, t - this.last); this.last = t;
    const [W, H, dpr] = fit(this.c);
    if (!W || !H) return;
    const g = this.g; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const C = this.cloud; if (!C) return;
    if (!this.auto && !this.drag) { this.idle += dt; if (this.idle > 3500) this.auto = true; }
    if (this.auto && !REDUCED) this.yaw += dt * .00045;

    const S = Math.min(W, H) * .4 * this.zoom, cx = W / 2, cy = H * .48, D = 4.2;
    const cyw = Math.cos(this.yaw), syw = Math.sin(this.yaw), cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const prog = REDUCED ? 1 : Math.min(1, (t - this.t0) / 1700), reveal = (1 - Math.pow(1 - prog, 3)) * 1.03;
    const base = Math.max(.9, S * .0072);
    const tr = (x, y, z) => {
      const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw;
      const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp, f = D / (D - z2);
      return [cx + x1 * S * f, cy - y2 * S * f, z2, f];
    };
    g.fillStyle = 'rgba(121,116,126,.38)'; g.beginPath();            // кольцо земли под зданием
    for (let i = 0; i < 120; i++) {
      const a = i / 120 * TAU, [x, y, , f] = tr(Math.cos(a) * C.rr, C.gy, Math.sin(a) * C.rr);
      g.moveTo(x + base * .8 * f, y); g.arc(x, y, base * .8 * f, 0, TAU);
    }
    g.fill();
    const B = [[], [], [], [], []];
    for (let i = 0; i < C.n; i++) {
      if (C.h01[i] > reveal) continue;                               // здание «вырастает» снизу вверх
      const [x, y, z, f] = tr(C.p[i * 3], C.p[i * 3 + 1], C.p[i * 3 + 2]);
      B[Math.max(0, Math.min(4, Math.floor((z + 1) / 2 * 5)))].push(x, y, f);
    }
    B.forEach((arr, k) => {
      g.fillStyle = `rgba(103,80,164,${.22 + k * .19})`; g.beginPath();
      for (let i = 0; i < arr.length; i += 3) { const r = base * arr[i + 2] * (.85 + k * .08); g.moveTo(arr[i] + r, arr[i + 1]); g.arc(arr[i], arr[i + 1], r, 0, TAU); }
      g.fill();
    });
  }
}

/* ============ ОБРАЩЕНИЕ К СЕРВЕРУ ============ */
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
const errText = e => e && e.status === 429 ? T[lang].busy : T[lang].fail;

const wikiCache = new Map();
function wikiInfo(title) {                        // фото и координаты из Википедии (берётся один раз)
  if (!wikiCache.has(title)) {
    wikiCache.set(title, fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(String(title).replace(/ /g, '_')))
      .then(r => r.ok ? r.json() : null).catch(() => null));
  }
  return wikiCache.get(title);
}

/* ============ ПОИСК ЗДАНИЙ ПО РИСУНКУ ============ */
const INK = '#1D1B20';
function exportImage(canvas) {                    // белый фон + линии → JPEG
  const t = document.createElement('canvas');
  t.width = canvas.width; t.height = canvas.height;
  const g = t.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, t.width, t.height); g.drawImage(canvas, 0, 0);
  return t.toDataURL('image/jpeg', .85);
}
function isBlank(canvas) {
  const d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return false;
  return true;
}

async function runGuess(canvas, hintEl, outEl, btn, view) {
  const t = T[lang];
  hintEl.className = 'hint';
  if (isBlank(canvas)) { hintEl.textContent = t.empty; return; }
  hintEl.textContent = t.thinking; outEl.innerHTML = ''; btn.disabled = true;
  try {
    const list = await api('/api/guess', { image: exportImage(canvas), lang });
    if (!Array.isArray(list) || !list.length) { hintEl.textContent = t.none; return; }
    hintEl.textContent = '';
    const thumbs = await Promise.all(list.map(p => wikiInfo(p.wiki).then(j => j && j.thumbnail ? j.thumbnail.source : null)));
    outEl.innerHTML = `<p class="results-hint">${t.resultsHint}</p><div class="results">` + list.map((p, i) => {
      const m = Math.max(0, Math.min(100, Math.round(Number(p.match) || 0)));
      return `<article class="result" tabindex="0" role="button" data-i="${i}">
        ${thumbs[i] ? `<img src="${esc(thumbs[i])}" alt="">` : '<div class="noimg"></div>'}
        <div class="body">
          <h3>${esc(p.name)}</h3>
          <div class="meta">${esc([p.city, p.country].filter(Boolean).join(', '))}</div>
          <div class="bar"><i style="width:${m}%"></i></div>
          <div class="meta">${t.match}: ${m}%</div>
          <p>${esc(p.why)}</p>
          <span class="go">${t.view3d} →</span>
        </div></article>`;
    }).join('') + '</div>';
    const open = el => { const c = el.closest('.result'); if (c) openDetail(list[+c.dataset.i], view); };
    outEl.onclick = e => open(e.target);
    outEl.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.result')) { e.preventDefault(); open(e.target); } };
    outEl.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
  } catch (e) {
    hintEl.className = 'hint error'; hintEl.textContent = errText(e);
  } finally { btn.disabled = false; }
}

function setupStroke(ctx) { ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; }

const saveUndo = () => { undoStack.push(mctx.getImageData(0, 0, mc.width, mc.height)); if (undoStack.length > 20) undoStack.shift(); };

const cc = $('camCanvas'), cctx = cc.getContext('2d');
setupStroke(cctx);
const video = $('video'), cursor = $('cursor'), camHint = $('camHint');
let stream = null, landmarker = null, rafId = null, lastVideoTime = -1, last = null, smooth = null;

async function loadModelHands() {

  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { HandLandmarker, FilesetResolver } = await import(base + '/vision_bundle.mjs');
  const fileset = await FilesetResolver.forVisionTasks(base + '/wasm');
  landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
    runningMode: 'VIDEO', numHands: 1

}
async function startCamera() {
  const t = T[lang];
  camHint.className = 'hint'; camHint.textContent = t.camAsk;
  try {                                           // здесь браузер сам спрашивает разрешение на камеру
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
  } catch (err) {
    camHint.className = 'hint error';
    camHint.textContent = err.name === 'NotFoundError' ? t.camNone : t.camDenied;
    return;
  }
  video.srcObject = stream; await video.play();
  try { await loadModelHands(); } catch { camHint.className = 'hint error'; camHint.textContent = t.fail; return; }
  camHint.textContent = t.camReady;
  loop();
}
function stopCamera() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null; last = null; smooth = null;
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = null; video.srcObject = null; cursor.style.display = 'none';
}
function loop() {
  if (!stream) return;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    if (res.landmarks.length) {
      const h = res.landmarks[0], tip = h[8], thumb = h[4];
      const rawX = (1 - tip.x) * cc.width, rawY = tip.y * cc.height;   // зеркало по X
      smooth = smooth ? [smooth[0] + (rawX - smooth[0]) * .5, smooth[1] + (rawY - smooth[1]) * .5] : [rawX, rawY];
      const handSize = Math.hypot(h[0].x - h[9].x, h[0].y - h[9].y);
      const pinch = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) / handSize < .3;
      const rect = cc.getBoundingClientRect(), stage = cc.parentElement.getBoundingClientRect();
      cursor.style.display = 'block';
      cursor.style.left = (smooth[0] / cc.width * rect.width + rect.left - stage.left) + 'px';
      cursor.style.top = (smooth[1] / cc.height * rect.height + rect.top - stage.top) + 'px';
      cursor.classList.toggle('draw', pinch);
      if (pinch) {
        if (last) { cctx.beginPath(); cctx.moveTo(last[0], last[1]); cctx.lineTo(smooth[0], smooth[1]); cctx.stroke(); }
        last = [smooth[0], smooth[1]];
      } else last = null;
    } else { cursor.style.display = 'none'; last = null; }
  }
  rafId = requestAnimationFrame(loop);
}

/* ============ ФОНОВАЯ МУЗЫКА (мягкая мелодия, которую создаёт сам код) ============ */
const Music = (() => {

    chords[i].forEach(f => tone(f, t, 9, .05, 'sine', 2.5));
    tone(bass[i], t, 9, .07, 'sine', 1.5);
    const n = 4 + Math.floor(Math.random() * 3);
    for (let k = 0; k < n; k++) tone(scale[Math.floor(Math.random() * scale.length)], t + .5 + k * (6.5 / n) + Math.random() * .4, 3.2, .045, 'triangle', .05);
    step++; timer = setTimeout(bar, 8000);
  }
  async function start() {
    on = true;
    if (MUSIC_FILE) { if (!audioEl) { audioEl = new Audio(MUSIC_FILE); audioEl.loop = true; audioEl.volume = .35; } audioEl.play().catch(() => {}); return; }
    if (!ctx) init();
    await ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.8, ctx.currentTime + 1.5);
    clearTimeout(timer); bar();
  }
  function stop() {
    on = false; clearTimeout(timer);
    if (audioEl) audioEl.pause();
    if (ctx) { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime); master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1); }
  }
  return { start, stop, isOn: () => on };
})();
function setMusic(wantOn) {
  wantOn ? Music.start() : Music.stop();
  $('btnMusic').classList.toggle('on', wantOn);
  localStorage.setItem('towerMusic', wantOn ? 'on' : 'off');
}
$('btnMusic').onclick = () => setMusic(!Music.isOn());
let autoTried = false;                            // браузер включает звук только после клика: включаем при первом клике на сайте
window.addEventListener('pointerdown', e => {
  if (autoTried) return;
  autoTried = true;
  if (e.target.closest('#btnMusic')) return;
  if (localStorage.getItem('towerMusic') !== 'off') setMusic(true);
}, true);

/* ============ СТАРТ ============ */
applyLang();
show('home');
window.__tower = { buildCloud, viewer, miniGlobe, globe, openDetail, show, state };   // для тестов
</script>
