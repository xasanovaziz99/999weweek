<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* ===== ЦВЕТА САЙТА: три цвета из палитры Material 3 + нейтральные ===== */
  :root {
    /* ===== ПАЛИТРА: меняй только эти строки, и весь сайт перекрасится ===== */
    --primary:  #6750A4;   /* главный цвет: кнопки, точки, акценты */
    --lavender: #EADDFF;   /* светлая версия того же цвета: плашки, выбранное */
    --light:    #9A82DB;   /* оттенок для нижней части 3D-моделей */
    --deep:     #3F2D7A;   /* оттенок для верхней части 3D-моделей */
    /* нейтральные: фон и текст (в счёт цветов не входят) */
    --surface: #FEF7FF; --card: #F3EDF7; --paper: #FFFFFF;
    --ink: #1D1B20; --ink2: #49454F; --line: #CAC4D0;
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Nunito', 'Noto Sans KR', system-ui, sans-serif;
    background: var(--surface); color: var(--ink);
    min-height: 100vh; line-height: 1.55; overflow-x: hidden;
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ---------- кнопки ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 24px; border: none; border-radius: 999px;
    font-weight: 500; font-size: .95rem; line-height: 1; font-family: inherit; cursor: pointer;
    background: var(--primary); color: #fff;
    transition: box-shadow .2s, filter .2s, background .2s, transform .1s;
  }
  .btn:hover { box-shadow: 0 1px 4px rgba(29,27,32,.28); filter: brightness(1.06); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: wait; box-shadow: none; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .btn.tonal { background: var(--lavender); color: var(--ink); }
  .btn.tonal:hover { filter: brightness(.97); }
  .btn.outline { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.outline:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); filter: none; }
  .btn.text { background: transparent; color: var(--primary); padding: 0 16px; }
  .btn.text:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); box-shadow: none; filter: none; }
  .btn.text.active, .btn.text.on { background: var(--lavender); color: var(--ink); }
  .btn.lg { height: 56px; padding: 0 32px; font-size: 1rem; }
  .btn.sm { height: 34px; padding: 0 16px; font-size: .875rem; }

  /* ---------- верхняя панель ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 24px; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(202,196,208,.5);
  }
  .langs { display: inline-flex; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; margin-left: 4px; }
  .langs button { border: none; background: transparent; font-weight: 500; font-size: .85rem; line-height: 1; font-family: inherit; color: var(--primary); height: 34px; padding: 0 14px; cursor: pointer; }
  .langs button:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .langs button.on { background: var(--lavender); color: var(--ink); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 1.1rem; letter-spacing: .01em; }
  .logo svg { width: 28px; height: 28px; }
  nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

  main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 24px 24px 80px; }
  .view { display: none; }
  .view.active { display: block; }
  .narrow { max-width: 900px; margin: 0 auto; }

  /* ---------- Земля из точек на фоне главного экрана ---------- */
  #globeBg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: none; }
  body.is-home #globeBg { display: block; }
  @media (max-width: 899px) { #globeBg { opacity: .55; } }

  /* ---------- главная ---------- */
  .hero { max-width: 560px; padding: clamp(20px, 5vh, 56px) 0 0; }
  .hero h1 { font-size: clamp(2rem, 4.4vw, 3.3rem); line-height: 1.12; font-weight: 500; letter-spacing: -.02em; }
  .hero h1 span { color: var(--primary); }
  .hero p { margin-top: 16px; font-size: 1.05rem; color: var(--ink2); max-width: 440px; }
  .modes { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .home-contacts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 0; padding-bottom: 8px; }
  .home-contacts a { font-size: .8rem; color: var(--ink2); text-decoration: none; padding: 4px 2px; }
  .home-contacts a:hover { color: var(--primary); }

  /* ---------- общие заголовки ---------- */
  h2 { font-size: 2rem; font-weight: 500; letter-spacing: -.01em; }
  .lead { color: var(--ink2); margin: 6px 0 24px; }

  /* ---------- как это работает ---------- */
  .steps { list-style: none; padding: 0; counter-reset: s; display: grid; gap: 12px; }
  .steps li {
    counter-increment: s; display: flex; gap: 16px; align-items: flex-start;
    padding: 16px 20px; border-radius: 24px; background: var(--card);
  }
  .steps li::before {
    content: counter(s); flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
    background: var(--lavender); display: grid; place-items: center; font-weight: 500;
  }

  /* ---------- контакты ---------- */
  .card { border-radius: 28px; padding: 8px 28px; background: var(--card); }
  .contact-row { display: flex; gap: 12px; flex-wrap: wrap; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .contact-row:last-child { border: none; }
  .contact-row b { min-width: 130px; font-weight: 500; color: var(--primary); }
  .contact-row a { color: var(--ink); }
  .contact-row a:hover { color: var(--primary); }

  /* ---------- рисование ---------- */
  .stage {
    position: relative; width: 100%; max-width: 680px; margin: 0 auto; aspect-ratio: 4 / 3;
    border-radius: 28px; overflow: hidden; background: var(--paper); border: 1px solid var(--line);
  }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage video { object-fit: cover; transform: scaleX(-1); opacity: .5; }
  .stage canvas { touch-action: none; }
  #mouseCanvas { cursor: crosshair; }
  .cursor {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    border: 3px solid var(--primary); pointer-events: none; display: none;
  }
  .cursor.draw { background: var(--primary); }
  .toolbar { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 16px 0; flex-wrap: wrap; }
  .toolbar .label { font-size: .875rem; color: var(--ink2); margin-right: 4px; }
  .hint { text-align: center; font-size: .95rem; color: var(--ink2); min-height: 1.6em; }
  .hint.error { color: var(--primary); font-weight: 500; }

  /* ---------- результаты ---------- */
  .results-hint { margin: 28px 0 12px; font-weight: 500; }
  .results { display: grid; gap: 12px; }
  .result {
    display: flex; gap: 16px; border-radius: 24px; overflow: hidden; background: var(--card); cursor: pointer;
    transition: box-shadow .2s, transform .2s;
  }
  .result:hover { box-shadow: 0 3px 14px color-mix(in srgb, var(--primary) 20%, transparent); transform: translateY(-2px); }
  .result img, .result .noimg { width: 168px; min-height: 140px; object-fit: cover; flex-shrink: 0; background: var(--lavender); }
  .result .body { padding: 14px 18px 14px 0; display: flex; flex-direction: column; gap: 2px; }
  .result h3 { font-size: 1.15rem; font-weight: 500; }
  .result .meta { font-size: .875rem; color: var(--ink2); }
  .result p { font-size: .95rem; margin-top: 4px; }
  .result .go { margin-top: auto; padding-top: 8px; color: var(--primary); font-weight: 500; font-size: .9rem; }
  .bar { height: 6px; background: var(--lavender); border-radius: 3px; margin: 8px 0 4px; overflow: hidden; max-width: 260px; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
  @media (max-width: 560px) {
    .result { flex-direction: column; }
    .result img, .result .noimg { width: 100%; height: 170px; }
    .result .body { padding: 0 18px 16px; }
  }

  /* ---------- экран здания ---------- */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-top: 16px; align-items: start; }
  .viewer-card {
    position: sticky; top: 84px; aspect-ratio: 1 / 1; border-radius: 28px; overflow: hidden;
    background: var(--card);
  }
  #modelCanvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #modelCanvas:active { cursor: grabbing; }
  .v-hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: .8rem; color: var(--ink2); pointer-events: none; }
  .v-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: var(--card); }
  .v-overlay[hidden] { display: none; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); animation: bounce 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.55); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  .info-card { display: flex; flex-direction: column; gap: 16px; }
  .chip { align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: var(--lavender); font-size: .85rem; font-weight: 500; min-height: 28px; }
  .chip:empty { display: none; }
  .info-card h2 { font-size: 2.1rem; line-height: 1.15; }
  .info-card .sub { color: var(--ink2); margin-top: -8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { padding: 14px 16px; border-radius: 20px; background: var(--lavender); }
  .stat small { display: block; font-size: .8rem; color: var(--ink2); }
  .stat b { font-size: 1.2rem; font-weight: 500; }
  .summary { font-size: 1.02rem; }
  .fact { padding: 16px 20px; border-radius: 20px; background: var(--card); box-shadow: inset 4px 0 0 var(--primary); }
  .fact[hidden] { display: none; }
  .fact b { display: block; margin-bottom: 2px; }
  .media { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photo, .mini { position: relative; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; background: var(--card); margin: 0; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo figcaption, .mini .cap { position: absolute; left: 8px; bottom: 8px; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 88%, transparent); font-size: .72rem; color: var(--ink2); }
  #miniGlobe { width: 100%; height: 100%; display: block; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { text-decoration: none; }
  @media (max-width: 860px) {
    .detail { grid-template-columns: 1fr; }
    .viewer-card { position: relative; top: 0; }
  }

  .result { animation: rise .5s both; }
  .result:nth-child(2) { animation-delay: .07s; } .result:nth-child(3) { animation-delay: .14s; }
  .result:nth-child(4) { animation-delay: .21s; } .result:nth-child(5) { animation-delay: .28s; } .result:nth-child(6) { animation-delay: .35s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .stage canvas.fx { pointer-events: none; display: none; }

  /* экскурсия по глобусу */
  .tour {
    display: inline-flex; align-items: center; gap: 12px; margin-top: 24px; padding: 8px 8px 8px 18px;
    border: none; border-radius: 999px; background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line); font-family: inherit; font-size: .95rem; cursor: pointer; transition: background .2s;
  }
  .tour:hover { background: var(--lavender); }
  .tour i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); animation: pulse 1.6s infinite; flex-shrink: 0; }
  .tour b { font-weight: 700; }
  .tour .go { background: var(--primary); color: #fff; border-radius: 999px; padding: 7px 14px; font-size: .85rem; font-weight: 500; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 50%, transparent); } 100% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--primary) 0%, transparent); } }

  /* витрина зданий */
  .featured { margin-top: clamp(20px, 4vh, 40px); }
  .featured h2 { font-size: 1rem; font-weight: 500; color: var(--ink2); margin-bottom: 4px; }
  .featured .lead { margin: 2px 0 12px; }
  .f-row { display: flex; gap: 16px; overflow-x: auto; padding: 8px 4px 20px; scroll-snap-type: x proximity; scrollbar-width: thin; }
  .f-card {
    flex: 0 0 232px; scroll-snap-align: start; border: none; padding: 0; text-align: left; overflow: hidden;
    border-radius: 28px; background: color-mix(in srgb, var(--card) 94%, transparent); cursor: pointer; font-family: inherit; color: inherit;
    transition: transform .2s, box-shadow .2s;
  }
  .f-card:hover, .f-card.active { transform: translateY(-4px); box-shadow: 0 6px 18px color-mix(in srgb, var(--primary) 22%, transparent), inset 0 0 0 2px var(--primary); }
  .f-card canvas { display: block; width: 100%; height: 150px; }
  .f-card .t { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 2px; }
  .f-card h3 { font-size: 1.02rem; font-weight: 700; }
  .f-card span { font-size: .85rem; color: var(--ink2); }

  /* атлас */
  .atlas-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 480px; border-radius: 28px; background: var(--card); overflow: hidden; }
  #atlasCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .chips button { border: none; border-radius: 999px; background: var(--lavender); color: var(--ink); font-family: inherit; font-size: .9rem; font-weight: 500; padding: 10px 16px; cursor: pointer; }
  .chips button:hover { filter: brightness(.96); }
  .links { align-items: center; }


  /* ===== современный слой: мягкие градиенты, стекло, крупные скругления ===== */
  body { background: radial-gradient(1000px 560px at 8% -8%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 70%),
                     radial-gradient(800px 520px at 100% 6%, color-mix(in srgb, var(--light) 22%, transparent), transparent 70%), var(--surface);
         background-attachment: fixed; }
  header {
    top: 12px; margin: 12px 16px 0; padding: 8px 12px 8px 20px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
    background: color-mix(in srgb, var(--paper) 64%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 10px 34px color-mix(in srgb, var(--primary) 12%, transparent);
  }
  .logo { font-weight: 800; letter-spacing: -.01em; }
  .btn.text.active, .btn.text.on { font-weight: 700; color: var(--primary); }
  .btn:not(.tonal):not(.outline):not(.text) {
    background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 55%, var(--light)));
    box-shadow: 0 8px 22px color-mix(in srgb, var(--primary) 38%, transparent);
  }
  .btn:not(.tonal):not(.outline):not(.text):hover { transform: translateY(-1px); filter: none; box-shadow: 0 12px 28px color-mix(in srgb, var(--primary) 46%, transparent); }
  .btn.tonal { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 16%, transparent); }
  h2 { font-weight: 800; letter-spacing: -.02em; }
  .hero h1 { font-weight: 800; letter-spacing: -.035em; line-height: 1.04; }
  .hero h1 span { background: linear-gradient(100deg, var(--primary), var(--light)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--ink2); }
  .featured h2 { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
  .f-card, .result, .steps li, .stat, .card, .viewer-card, .atlas-wrap, .stage, .photo, .mini, .fact { border-radius: 32px; }
  .f-card {
    background: color-mix(in srgb, var(--paper) 72%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
    box-shadow: 0 8px 28px color-mix(in srgb, var(--primary) 9%, transparent);
  }
  .f-card:hover, .f-card.active { box-shadow: 0 16px 38px color-mix(in srgb, var(--primary) 24%, transparent), inset 0 0 0 2px var(--primary); }
  .f-card h3 { font-weight: 800; letter-spacing: -.01em; }
  .result, .steps li, .card { background: color-mix(in srgb, var(--paper) 70%, transparent); border: 1px solid color-mix(in srgb, var(--line) 45%, transparent); box-shadow: 0 8px 26px color-mix(in srgb, var(--primary) 7%, transparent); }
  .result h3 { font-weight: 800; letter-spacing: -.01em; }
  .result .noimg { background: linear-gradient(135deg, var(--lavender), color-mix(in srgb, var(--light) 40%, var(--lavender))); }
  .steps li::before { background: linear-gradient(135deg, var(--primary), var(--light)); color: #fff; font-weight: 700; }
  .stage { box-shadow: 0 14px 44px color-mix(in srgb, var(--primary) 14%, transparent); border: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .viewer-card, .atlas-wrap { background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--primary) 10%, var(--paper)), var(--card)); border: 1px solid color-mix(in srgb, var(--line) 45%, transparent); box-shadow: 0 14px 44px color-mix(in srgb, var(--primary) 12%, transparent); }
  .info-card h2 { font-weight: 800; letter-spacing: -.03em; }
  .stat { background: color-mix(in srgb, var(--primary) 9%, var(--paper)); border: 1px solid color-mix(in srgb, var(--primary) 14%, transparent); }
  .chip { background: color-mix(in srgb, var(--primary) 12%, var(--paper)); color: var(--primary); font-weight: 700; }
  .chips button { background: color-mix(in srgb, var(--primary) 10%, var(--paper)); border: 1px solid color-mix(in srgb, var(--primary) 16%, transparent); }
  .photo, .mini { background: color-mix(in srgb, var(--primary) 6%, var(--paper)); }

  /* парящие здания на главной */
  #globeBg { pointer-events: none; }
  .float-tip {
    position: fixed; z-index: 5; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none;
    padding: 8px 14px; border-radius: 999px; font-size: .85rem; font-weight: 700; white-space: nowrap;
    background: color-mix(in srgb, var(--paper) 86%, transparent); color: var(--ink);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 20%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--primary) 25%, transparent);
    opacity: 0; transition: opacity .15s;
  }
  .float-tip.on { opacity: 1; }
  .float-tip span { color: var(--primary); font-weight: 500; margin-left: 6px; }
  .float-hint { margin-top: 10px; font-size: .8rem; color: var(--ink2); }
  .result .noimg, .noimg {
    background: radial-gradient(circle, color-mix(in srgb, var(--primary) 30%, transparent) 1.8px, transparent 2.4px) 0 0 / 14px 14px,
                linear-gradient(135deg, var(--lavender), color-mix(in srgb, var(--light) 35%, var(--lavender)));
  }
  /* главная: текст крупнее, кнопки и контакты ниже */
  .hero { padding-top: clamp(28px, 7vh, 80px); }
  .hero p { font-size: 1.3rem; line-height: 1.55; max-width: 520px; margin-top: 20px; }
  .modes { margin-top: clamp(40px, 8vh, 76px); }
  .home-contacts { margin-top: clamp(40px, 9vh, 90px); gap: 22px; }
  .home-contacts a { font-size: .92rem; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<body class="is-home">

<canvas id="globeBg" aria-hidden="true"></canvas>

<header>
  <span class="logo">
    <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" style="fill:var(--lavender)"/><g style="fill:var(--primary)"><circle cx="9" cy="10" r="1.6"/><circle cx="14" cy="8" r="1.6"/><circle cx="19" cy="11" r="1.6"/><circle cx="11" cy="15" r="1.6"/><circle cx="16" cy="16" r="1.6"/><circle cx="20" cy="17" r="1.2"/><circle cx="13" cy="20" r="1.4"/></g></svg>
    Tower Sketch
  </span>
  <nav>
    <button class="btn text sm" id="btnHome" data-i18n="home"></button>
    <button class="btn text sm" id="btnInfo" data-i18n="info"></button>
    <button class="btn text sm" id="btnAtlas"><span data-i18n="atlas"></span> <span id="atlasCount"></span></button>
    <button class="btn text sm" id="btnMusic"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg><span data-i18n="music"></span></button>
    <div class="langs" id="langs"><button data-lang="en">EN</button><button data-lang="ko">한국어</button><button data-lang="ru">RU</button></div>
  </nav>
</header>

<main>
  <!-- ГЛАВНАЯ -->
  <section class="view active" id="view-home">
    <div class="hero">

function topoToMask(topo) {                       // карта мира → маска суши 360×180 (1 клетка = 1°)
  const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
  const arcs = topo.arcs.map(a => { let x = 0, y = 0; return a.map(p => { x += p[0]; y += p[1]; return [x * sx + tx, y * sy + ty]; }); });
  const arc = i => i >= 0 ? arcs[i] : arcs[~i].slice().reverse();
  const ring = idx => { const pts = []; idx.forEach((i, k) => { const a = arc(i); for (let j = k ? 1 : 0; j < a.length; j++) pts.push(a[j]); }); return pts; };
  const W = 360, H = 180, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff';
  const obj = topo.objects.land, geoms = obj.geometries || [obj];
  geoms.forEach(geo => {
    const polys = geo.type === 'MultiPolygon' ? geo.arcs : [geo.arcs];
    polys.forEach(poly => {

  if (!p || p.missing !== undefined || !p.title) return null;
  const c = p.coordinates && p.coordinates[0];
  return {
    title: p.title,
    url: p.fullurl || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_'))),
    thumb: p.thumbnail ? p.thumbnail.source : null,
    lat: c ? c.lat : null, lon: c ? c.lon : null,
    disambig: !!(p.pageprops && p.pageprops.disambiguation !== undefined),
    index: p.index || 0
  };
};
async function getJSON(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; }
}
async function wikiQuery(extra) {
  const q = new URLSearchParams({
    action: 'query', format: 'json', origin: '*', redirects: '1', prop: 'pageimages|coordinates|pageprops|info',
    inprop: 'url', piprop: 'thumbnail', pithumbsize: '1000', colimit: '1', ppprop: 'disambiguation', ...extra
  });
  const j = await getJSON(WIKI_API + '?' + q);
  return Object.values((j && j.query && j.query.pages) || {}).map(pageInfo).filter(Boolean).sort((a, b) => a.index - b.index);
}
async function restSummary(title) {                // быстрый способ: краткая справка со статьёй и главным фото
  const j = await getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(String(title).replace(/ /g, '_')) + '?redirect=true');
  if (!j || j.type === 'disambiguation' || !j.title) return null;
  return {
    title: j.title,
    url: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(j.title.replace(/ /g, '_'))),
    thumb: bigThumb(j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source) || null,
    lat: j.coordinates ? j.coordinates.lat : null, lon: j.coordinates ? j.coordinates.lon : null, disambig: false
  };
}
async function commonsPhoto(q) {                   // запасной источник: поиск фотографий в Wikimedia Commons
  const p = new URLSearchParams({
    action: 'query', format: 'json', origin: '*', generator: 'search', gsrsearch: q + ' filetype:bitmap', gsrnamespace: '6',
    gsrlimit: '6', prop: 'imageinfo', iiprop: 'url|mime', iiurlwidth: '960'
  });
  const j = await getJSON('https://commons.wikimedia.org/w/api.php?' + p);
  const pages = Object.values((j && j.query && j.query.pages) || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
  for (const pg of pages) {
    const ii = pg.imageinfo && pg.imageinfo[0];
    if (ii && /jpe?g|png/.test(ii.mime || '') && ii.thumburl) return ii.thumburl;
  }
  return null;
}
function resolveWiki(item) {                       // находит настоящую статью и фото, даже если название чуть неточное
  const key = (item.wiki || '') + '|' + (item.name || '');
  if (!wikiMemo.has(key)) {
    wikiMemo.set(key, (async () => {
      const title = item.wiki || item.name;
      const sv = await getJSON(API_BASE + '/api/photo?title=' + encodeURIComponent(title));   // самый надёжный путь: через наш сервер
      let best = await restSummary(title);
      if (sv && sv.thumb) {
        if (!best) best = { title, url: sv.page || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(String(title).replace(/ /g, '_'))), lat: null, lon: null, disambig: false };
        best.thumb = sv.thumb; best.url = best.url || sv.page;
        return best;
      }
      if (!best) { const a = (await wikiQuery({ titles: title }))[0]; best = a && !a.disambig ? a : null; }
      if (!best || !best.thumb) {
        const words = String(title).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 4);
        const found = (await wikiQuery({ generator: 'search', gsrsearch: title, gsrlimit: '6' }))
          .filter(c => !c.disambig && words.some(w => c.title.toLowerCase().includes(w)));
        const alt = found.find(c => c.thumb) || found[0] || null;
        if (!best) best = alt;
        else if (alt) {
          if (!best.thumb && alt.thumb) best.thumb = alt.thumb;
          if (best.lat == null && alt.lat != null) { best.lat = alt.lat; best.lon = alt.lon; }
        }
      }
      if (!best || !best.thumb) {
        const img = await commonsPhoto(title);
        if (img) {
          if (!best) best = { title, url: 'https://en.wikipedia.org/w/index.php?search=' + encodeURIComponent(title), lat: null, lon: null, disambig: false };
          best.thumb = img;
        }
      }
      return best;
    })());
  }
  return wikiMemo.get(key);
}

/* ============ ПОИСК ЗДАНИЙ ПО РИСУНКУ ============ */
const INK = '#1D1B20';
function exportImage(canvas) {                    // белый фон + линии → JPEG
  const t = document.createElement('canvas');
  t.width = canvas.width; t.height = canvas.height;
  const g = t.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, t.width, t.height); g.drawImage(canvas, 0, 0);
  return t.toDataURL('image/jpeg', .85);
}
function isBlank(canvas) {
  const d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return false;
  return true;
}

async function runGuess(canvas, hintEl, outEl, btn, view) {
  const t = T[lang];
  hintEl.className = 'hint';
  if (isBlank(canvas)) { hintEl.textContent = t.empty; return; }
  hintEl.textContent = t.thinking; outEl.innerHTML = ''; btn.disabled = true;
  const sketch = exportImage(canvas);
  const fx = new Dissolve(canvas); fx.start();     // рисунок рассыпается на точки, пока ИИ думает
  try {
    const list = await api('/api/guess', { image: sketch, lang });
    if (!Array.isArray(list) || !list.length) { hintEl.textContent = t.none; return; }
    list.sort((a, b) => (Number(b.match) || 0) - (Number(a.match) || 0));
    hintEl.textContent = '';
    const wikis = await Promise.all(list.map(p => resolveWiki(p)));
    outEl.innerHTML = `<p class="results-hint">${t.resultsHint}</p><div class="results">` + list.map((p, i) => {
      const m = Math.max(0, Math.min(100, Math.round(Number(p.match) || 0))), th = wikis[i] && wikis[i].thumb;
      return `<article class="result" tabindex="0" role="button" data-i="${i}">
        ${th ? `<img src="${esc(th)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;noimg&quot;></div>'">` : '<div class="noimg"></div>'}
        <div class="body">
          <h3>${esc(p.name)}</h3>
          <div class="meta">${esc([p.city, p.country].filter(Boolean).join(', '))}</div>
          <div class="bar"><i style="width:${m}%"></i></div>
          <div class="meta">${t.match}: ${m}%</div>
          <p>${esc(p.why)}</p>
          <span class="go">${t.view3d} →</span>
        </div></article>`;
    }).join('') + '</div>';
    const open = el => { const c = el.closest('.result'); if (c) { const i = +c.dataset.i; openDetail(list[i], view, { sketch, wiki: wikis[i] }); } };
    outEl.onclick = e => open(e.target);
    outEl.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.result')) { e.preventDefault(); open(e.target); } };
    outEl.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
  } catch (e) {
    hintEl.className = 'hint error'; hintEl.textContent = errText(e);
  } finally { fx.stop(); btn.disabled = false; }
}

/* рисунок рассыпается на точки, а потом собирается обратно */
class Dissolve {
  constructor(src) { this.src = src; this.fx = src.parentElement.querySelector('canvas.fx'); this.raf = 0; this.k = 0; this.state = 'idle'; }
  start() {
    if (!this.fx) return;
    const c = this.src, d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data, pts = [], step = 3;
    for (let y = 0; y < c.height; y += step) for (let x = 0; x < c.width; x += step)
      if (d[(y * c.width + x) * 4 + 3] > 110) pts.push({ x: x / c.width, y: y / c.height, a: Math.random() * TAU, r: Math.random() });
    for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
    this.pts = pts.slice(0, 2600);
    this.t0 = performance.now(); this.state = 'run';
    this.src.style.opacity = '0'; this.fx.style.display = 'block';
    const loop = t => { this.draw(t); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  stop() {
    if (this.state !== 'run') return;
    this.state = 'back'; this.tb = performance.now(); this.k0 = this.k;
  }
  draw(t) {
    const [W, H, dpr] = fit(this.fx), g = this.fx.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const time = (t - this.t0) / 1000, ease = x => 1 - Math.pow(1 - x, 3);
    if (this.state === 'run') this.k = ease(Math.min(1, time / 1.1));
    else { const q = Math.min(1, (t - this.tb) / 550); this.k = this.k0 * (1 - ease(q)); if (q >= 1) return this.finish(); }
    for (const p of this.pts) {
      const bx = p.x * W, by = p.y * H, ang = p.a + time * (.5 + p.r), rad = this.k * (14 + p.r * 46) * (1 + .25 * Math.sin(time * 2.2 + p.a * 3));
      g.fillStyle = `rgba(${(p.r > .78 ? TH.light : TH.primary).join(',')},.85)`;
      g.beginPath(); g.arc(bx + Math.cos(ang) * rad, by + Math.sin(ang) * rad, 1.6 + p.r * 1.8, 0, TAU); g.fill();
    }
  }
  finish() {
    cancelAnimationFrame(this.raf); this.state = 'idle';
    this.fx.style.display = 'none'; this.src.style.opacity = '';
  }
}

/* ============ ЭКРАН ЗДАНИЯ ============ */
const state = { item: null, from: 'mouse', token: 0, info: null, sketch: null, wiki: null, preset: null };
const fmtYear = y => { y = Number(y); if (!Number.isFinite(y)) return ''; return y < 0 ? T[lang].bc.replace('{n}', -y) : String(y); };

function setPinFrom(lat, lon, force) {
  if (!force && miniGlobe.pin) return;
  miniGlobe.setPin(lat, lon);
}
function coords() {                                // лучшие известные координаты здания
  const w = state.wiki, i = state.info, p = state.preset, ok = v => v != null && Number.isFinite(Number(v));
  if (w && ok(w.lat) && ok(w.lon)) return [Number(w.lat), Number(w.lon)];

}
function renderLinks() {
  const item = state.item, t = T[lang]; if (!item) return;

  const wurl = w && w.url ? w.url : 'https://en.wikipedia.org/w/index.php?search=' + encodeURIComponent(item.wiki || item.name);
  const q = encodeURIComponent(c ? c[0] + ',' + c[1] : item.name);

    `<a class="btn tonal sm" target="_blank" rel="noopener" href="${esc(wurl)}">${t.wikiLink}</a>` +
    `<a class="btn outline sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">${t.mapLink}</a>`;
}
function noteFound() {                             // запоминает здание в атласе
  const c = coords(), it = state.item;
  if (!c || !it) return;
  addFound({ wiki: it.wiki, name: it.name, city: it.city || '', country: it.country || '', lat: c[0], lon: c[1] });
}

function openDetail(item, from, extra = {}) {
  const my = ++state.token;
  state.item = item; state.from = from; state.info = null; state.sketch = extra.sketch || null; state.wiki = null;
  state.preset = PRESETS.find(p => p.wiki === item.wiki) || null;
  show('detail');
  const place = [item.city, item.country].filter(Boolean).join(', ');
  $('dType').textContent = ''; $('dTitle').textContent = item.name || '';
  $('dSub').textContent = place; $('dWhere').textContent = place;
  $('dStats').innerHTML = ''; $('dSummary').textContent = T[lang].infoLoading; $('dFact').hidden = true; $('dLinks').innerHTML = '';
  $('dPhotoBox').hidden = true;
  miniGlobe.clearPin(); miniGlobe.auto = true;
  viewer.cloud = null;

  const wp = extra.wiki ? Promise.resolve(extra.wiki) : resolveWiki(item);
  wp.then(w => {
    if (my !== state.token) return;
    state.wiki = w;
    if (w && w.thumb) {

async function loadInfo(my) {
  const item = state.item, t = T[lang];
  if (!item) return;
  $('dSummary').textContent = t.infoLoading;
  const pr = state.preset;
  const showStats = (year, h, arch) => {
    const stats = [];
    if (year != null && fmtYear(year)) stats.push([t.built, fmtYear(year)]);
    if (h != null && Number.isFinite(Number(h))) stats.push([t.height, Math.round(h) + ' m']);
    if (arch) stats.push([t.architect, arch]);
    $('dStats').innerHTML = stats.map(s => `<div class="stat"><small>${esc(s[0])}</small><b>${esc(s[1])}</b></div>`).join('');
  };
  try {
    const info = await api('/api/info', { wiki: item.wiki, name: item.name, lang });
    if (my !== state.token) return;
    state.info = info;
    $('dType').textContent = info.type || '';
    const place = [info.city, info.country].filter(Boolean).join(', ');
    if (place) { $('dSub').textContent = place; $('dWhere').textContent = place; }

    $('dSummary').textContent = info.summary || '';

  } catch (e) {

    $('dSummary').textContent = e.status === 429 ? t.busy : t.infoFail;

  }
}

async function loadModel(my) {

/* ============ РИСОВАНИЕ МЫШЬЮ ============ */
function setupStroke(ctx) { ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; }
const pos = (e, c) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };

const mc = $('mouseCanvas'), mctx = mc.getContext('2d');
setupStroke(mctx);
const undoStack = [];
const saveUndo = () => { undoStack.push(mctx.getImageData(0, 0, mc.width, mc.height)); if (undoStack.length > 20) undoStack.shift(); };
let drawing = false;
mc.addEventListener('pointerdown', e => {
  saveUndo(); drawing = true; mc.setPointerCapture(e.pointerId);
  const [x, y] = pos(e, mc); mctx.beginPath(); mctx.moveTo(x, y); mctx.lineTo(x + .01, y); mctx.stroke();
});
mc.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e, mc); mctx.lineTo(x, y); mctx.stroke(); });
['pointerup', 'pointercancel'].forEach(ev => mc.addEventListener(ev, () => drawing = false));
$('mouseUndo').onclick = () => { const s = undoStack.pop(); if (s) mctx.putImageData(s, 0, 0); };
$('mouseClear').onclick = () => { saveUndo(); mctx.clearRect(0, 0, mc.width, mc.height); $('mouseResults').innerHTML = ''; $('mouseHint').textContent = ''; };
$('mouseSave').onclick = () => { const a = document.createElement('a'); a.download = 'my-sketch.jpg'; a.href = exportImage(mc); a.click(); };
$('mouseGuess').onclick = () => runGuess(mc, $('mouseHint'), $('mouseResults'), $('mouseGuess'), 'mouse');

const examples = {
  triangle: c => { c.moveTo(320, 90); c.lineTo(520, 380); c.lineTo(120, 380); c.closePath(); },
  twin: c => { c.rect(190, 70, 80, 320); c.rect(370, 70, 80, 320); },
  spire: c => { c.moveTo(320, 50); c.lineTo(390, 390); c.moveTo(320, 50); c.lineTo(250, 390); c.moveTo(290, 280); c.lineTo(350, 280); }
};

/* ============ РИСОВАНИЕ КАМЕРОЙ (пальцем в воздухе) ============ */
const cc = $('camCanvas'), cctx = cc.getContext('2d');
setupStroke(cctx);
const video = $('video'), cursor = $('cursor'), camHint = $('camHint');
let stream = null, landmarker = null, rafId = null, lastVideoTime = -1, last = null, smooth = null;

async function loadModelHands() {
  if (landmarker) return;
  camHint.textContent = T[lang].camLoad;
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { HandLandmarker, FilesetResolver } = await import(base + '/vision_bundle.mjs');
  const fileset = await FilesetResolver.forVisionTasks(base + '/wasm');
  landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
    runningMode: 'VIDEO', numHands: 1
  });
}
async function startCamera() {
  const t = T[lang];
  camHint.className = 'hint'; camHint.textContent = t.camAsk;
  try {                                           // здесь браузер сам спрашивает разрешение на камеру
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
  } catch (err) {
    camHint.className = 'hint error';
    camHint.textContent = err.name === 'NotFoundError' ? t.camNone : t.camDenied;
    return;
  }
  video.srcObject = stream; await video.play();
  try { await loadModelHands(); } catch { camHint.className = 'hint error'; camHint.textContent = t.fail; return; }
  camHint.textContent = t.camReady;
  loop();
}
function stopCamera() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null; last = null; smooth = null;
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = null; video.srcObject = null; cursor.style.display = 'none';
}
function loop() {
  if (!stream) return;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    if (res.landmarks.length) {
      const h = res.landmarks[0], tip = h[8], thumb = h[4];
      const rawX = (1 - tip.x) * cc.width, rawY = tip.y * cc.height;   // зеркало по X
      smooth = smooth ? [smooth[0] + (rawX - smooth[0]) * .5, smooth[1] + (rawY - smooth[1]) * .5] : [rawX, rawY];
      const handSize = Math.hypot(h[0].x - h[9].x, h[0].y - h[9].y);
      const pinch = Math.hypot(tip.x - thumb.x, tip.y - thumb.y) / handSize < .3;
      const rect = cc.getBoundingClientRect(), stage = cc.parentElement.getBoundingClientRect();
      cursor.style.display = 'block';
      cursor.style.left = (smooth[0] / cc.width * rect.width + rect.left - stage.left) + 'px';

const Music = (() => {
  let ctx, master, bus, timer, audioEl, on = false, step = 0;
  const chords = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]];
  const bass = [110, 87.31, 130.81, 98], scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(master);
    const delay = ctx.createDelay(1.5); delay.delayTime.value = .55;
    const fb = ctx.createGain(); fb.gain.value = .38; const wet = ctx.createGain(); wet.gain.value = .45;
    bus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  }
  function tone(f, t, dur, vol, type, attack) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .1);
  }
  function bar() {
    if (!on) return;
    const t = ctx.currentTime + .1, i = step % 4;
    chords[i].forEach(f => tone(f, t, 9, .05, 'sine', 2.5));
    tone(bass[i], t, 9, .07, 'sine', 1.5);
    const n = 4 + Math.floor(Math.random() * 3);
    for (let k = 0; k < n; k++) tone(scale[Math.floor(Math.random() * scale.length)], t + .5 + k * (6.5 / n) + Math.random() * .4, 3.2, .045, 'triangle', .05);
    step++; timer = setTimeout(bar, 8000);
  }
  async function start() {
    on = true;
    if (MUSIC_FILE) { if (!audioEl) { audioEl = new Audio(MUSIC_FILE); audioEl.loop = true; audioEl.volume = .35; } audioEl.play().catch(() => {}); return; }
    if (!ctx) init();
    await ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.8, ctx.currentTime + 1.5);
    clearTimeout(timer); bar();
  }
  function stop() {
    on = false; clearTimeout(timer);
    if (audioEl) audioEl.pause();
    if (ctx) { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime); master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1); }
  }
  return { start, stop, isOn: () => on };
})();

}

const SPOTS = (() => {
  const r = mulberry(21), out = [], N = 22;
  for (let i = 0; i < N; i++) {

    const s = [.36, .25, .16][band] * (.8 + r() * .5);
    out.push({ m: (i * 5) % BG_MODELS.length, x: .04 + fx * .94, y: .1 + ((i * .37 + r() * .3) % 1) * .84, s, sp: .7 + r() * .8, ph: r() * 6.28, ys: (r() < .5 ? -1 : 1) * (.0002 + r() * .0002), a: [.9, .65, .45][band] });
  }
  return out.sort((p, q) => p.s - q.s);
})();
class Floaters {
  constructor(canvas) { this.c = canvas; this.g = canvas.getContext('2d'); this.raf = 0; this.t0 = 0; this.tx = 0; this.ty = 0; this.px = 0; this.py = 0; }
  start() {
    if (this.raf) return;
    this.t0 = performance.now();
    const loop = t => { this.draw(t); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
  draw(t) {
    const [W, H, dpr] = fit(this.c);
    if (!W || !H) return;
    const g = this.g; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    this.px += (this.tx - this.px) * .05; this.py += (this.ty - this.py) * .05;
    const narrow = W < 900, k = Math.min(W * (narrow ? 1.1 : .8), H * 1.25);
    SPOTS.forEach((sp, i) => {
      const prog = REDUCED ? 1 : Math.min(1, (t - this.t0 - i * 120) / 2400);
      if (prog <= 0) return;
      const b = sp.s * k;
      const bob = REDUCED ? 0 : Math.sin(t * .0008 * sp.sp + sp.ph) * (8 + sp.s * 16);
      const drift = REDUCED ? 0 : Math.cos(t * .0005 * sp.sp + sp.ph) * 10;
      const x = sp.x * W + drift + this.px * sp.s * 40, y = sp.y * H + bob + this.py * sp.s * 26;
      const left = !narrow && sp.x < .5 ? .5 : 1;                 // слева текст: там здания бледнее, чтобы не мешали читать
      g.save();
      g.globalAlpha = Math.min(1, sp.a * left * Math.min(1, prog * 3));
      g.translate(x - b / 2, y - b / 2);
      renderCloud(g, b, b, BG_MODELS[sp.m], { yaw: t * sp.ys + sp.ph, pitch: .16 + Math.sin(t * .0006 + sp.ph) * .05, zoom: 1, prog, small: true });
      g.restore();
    });
  }
}
const floaters = new Floaters($('globeBg'));
window.addEventListener('mousemove', e => { floaters.tx = e.clientX / innerWidth - .5; floaters.ty = e.clientY / innerHeight - .5; });

/* ============ АТЛАС: все найденные здания на глобусе ============ */
const atlasGlobe = new Globe($('atlasCanvas'), (W, H) => [W / 2, H / 2, Math.min(W * .5, H * .46)], { rot: 0, tilt: .3 });
const FKEY = 'towerFound';
const getFound = () => { try { const a = JSON.parse(localStorage.getItem(FKEY) || '[]'); return Array.isArray(a) ? a : []; } catch { return []; } };
function addFound(it) {
  if (!it || !it.wiki || it.lat == null || it.lon == null) return;
  const a = getFound();
  if (a.some(x => x.wiki === it.wiki)) return;
  a.push(it);
  try { localStorage.setItem(FKEY, JSON.stringify(a.slice(-200))); } catch {}
  updateAtlasCount();
}
function updateAtlasCount() { const n = getFound().length; $('atlasCount').textContent = n ? '(' + n + ')' : ''; }
function renderAtlas() {
  const a = getFound();
  atlasGlobe.pins = a;
  $('atlasChips').innerHTML = a.map((x, i) => `<button type="button" data-i="${i}">${esc(x.name)}</button>`).join('');
  $('atlasEmpty').textContent = a.length ? '' : T[lang].atlasEmpty;
  $('atlasChips').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const x = a[+b.dataset.i];
    openDetail({ name: x.name, wiki: x.wiki, city: x.city, country: x.country }, 'atlas');
  };
}

/* ============ СТАРТ ============ */
applyLang();
show('home');
window.__tower = { buildCloud, viewer, miniGlobe, floaters, openDetail, show, state };   // для тестов
</script>
</body>
</html>
